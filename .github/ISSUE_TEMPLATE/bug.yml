name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    attributes: {label: What happened}
    validations: {required: true}
  - type: textarea
    attributes: {label: What you expected}
    validations: {required: true}
  - type: textarea
    attributes: {label: Steps to reproduce, render: shell}
    validations: {required: true}
  - type: input
    attributes: {label: Version}
