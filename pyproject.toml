[project]
name = "toolmarshal"
version = "0.0.1"
description = "Policy firewall for agent tool calls"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
toolmarshal = "toolmarshal.proxy:main"
toolmarshal-http = "toolmarshal.http_proxy:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[dependency-groups]
dev = ["ruff", "mypy", "pytest", "pytest-cov", "pre-commit", "commitizen"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "S", "RUF", "PT", "C4", "RET", "PTH", "ERA", "TRY", "D"]
ignore = ["D100", "D104", "D203", "D213"]

[tool.ruff.lint.pep8-naming]
# http.server dispatches to do_<METHOD>
extend-ignore-names = ["do_*"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "D"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--cov --cov-branch --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
patch = ["subprocess"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']

[tool.commitizen]
name = "cz_conventional_commits"
